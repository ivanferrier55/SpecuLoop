<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpecuLoop — Markdown Workspace</title>
<style>
:root { --bg:#1e1e2e; --fg:#cdd6f4; --muted:#6c7086; --border:#313244;
  --surface:#181825; --blue:#89b4fa; --green:#a6e3a1; --red:#f38ba8;
  --yellow:#f9e2af; --teal:#94e2d5; --mauve:#cba6f7; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;gap:16px;align-items:center;font-size:13px}
header b{color:var(--blue)}
header .stat{color:var(--muted)}
.main{display:grid;grid-template-columns:220px 1fr 1fr;flex:1;overflow:hidden}
.sidebar{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
.sidebar h3{padding:10px 12px 6px;font-size:12px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px}
.file-list{flex:1;overflow-y:auto;padding:0 4px}
.file-item{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;
  display:flex;justify-content:space-between;align-items:center}
.file-item:hover{background:#313244}
.file-item.active{background:#45475a;color:var(--blue)}
.file-item .ver{font-size:10px;color:var(--muted)}
.file-item .dot{width:6px;height:6px;border-radius:50%;margin-left:6px;flex-shrink:0}
.file-item .dot.saved{background:var(--green)}
.file-item .dot.dirty{background:var(--yellow)}
.center{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.editor-header{padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center}
.editor-header .fname{color:var(--fg);font-weight:600}
textarea{flex:1;background:var(--bg);color:var(--fg);border:none;resize:none;
  padding:14px;font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.6;outline:none}
.save-btn{padding:4px 14px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);color:var(--fg);cursor:pointer;font-size:12px}
.save-btn:hover{background:#45475a}
.save-btn:active{background:var(--blue);color:var(--bg)}
.right{display:flex;flex-direction:column;overflow:hidden}
.graph-container{flex:1;position:relative;overflow:hidden}
.graph-container svg{width:100%;height:100%}
.graph-container .hint{position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--muted)}
.inspector{background:var(--surface);border-top:1px solid var(--border);
  max-height:220px;overflow-y:auto;padding:10px 14px;font-size:12px}
.inspector h4{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.inspector .row{margin-bottom:4px;line-height:1.5}
.inspector .prov{color:var(--teal)}
.inspector .edge{color:var(--mauve)}
.bottom{background:var(--surface);border-top:1px solid var(--border);
  max-height:180px;overflow-y:auto;padding:8px 14px;font-size:12px;font-family:monospace}
.bottom .ev{margin-bottom:4px}
.bottom .ev .tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;
  font-weight:600;margin-right:6px}
.tag.added{background:rgba(166,227,161,.15);color:var(--green)}
.tag.removed{background:rgba(243,139,168,.15);color:var(--red)}
.tag.file{background:rgba(137,180,250,.15);color:var(--blue)}
.tag.unresolved{background:rgba(249,226,175,.15);color:var(--yellow)}
.empty{color:var(--muted);font-style:italic;padding:20px;text-align:center}
.node circle{stroke-width:2px;cursor:pointer}
.node circle:hover{stroke:var(--blue);stroke-width:3px}
.node text{fill:var(--fg);font-size:11px;pointer-events:none}
.edge line{stroke:var(--border);stroke-width:1.5}
.edge text{fill:var(--muted);font-size:9px;pointer-events:none}
</style>
</head>
<body>
<header>
  <b>SpecuLoop</b>
  <span id="ws-path" class="stat"></span>
  <span id="ws-stats" class="stat"></span>
  <span id="ws-status" class="stat" style="margin-left:auto"></span>
</header>
<div class="main">
  <div class="sidebar">
    <h3>Files</h3>
    <div id="file-list" class="file-list"></div>
    <div style="padding:8px"><button class="save-btn" style="width:100%" onclick="newFile()">+ New file</button></div>
  </div>
  <div class="center">
    <div class="editor-header">
      <span class="fname" id="editor-name">Select a file</span>
      <button class="save-btn" id="save-btn" onclick="saveAndSync()" disabled>Save &amp; Sync</button>
    </div>
    <textarea id="editor" placeholder="Select a file from the list, or click + New file" disabled></textarea>
  </div>
  <div class="right">
    <div class="graph-container" id="graph"></div>
    <div class="inspector" id="inspector">
      <h4>Inspector</h4>
      <div class="empty">Click a node or edge in the graph to inspect its provenance</div>
    </div>
  </div>
</div>
<div class="bottom" id="report">
  <div class="empty">Sync report will appear here after you save</div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const API = '';
let currentFile = null;
let graphData = {nodes:[], edges:[]};
let dirty = false;

// --- file list ---

async function loadFiles(){
  const files = await (await fetch(API+'/api/files')).json();
  const list = document.getElementById('file-list');
  list.innerHTML = '';
  files.forEach(f=>{
    const d = document.createElement('div');
    d.className = 'file-item'+(f.name===currentFile?' active':'');
    const saved = f.unchanged;
    d.innerHTML = `<span>${f.name}</span><span class="dot ${saved?'saved':'dirty'}"></span>`;
    d.onclick = ()=> openFile(f.name);
    list.appendChild(d);
  });
}

async function openFile(name){
  if(dirty && !confirm('Discard unsaved changes?')) return;
  currentFile = name;
  const res = await (await fetch(API+`/api/file?name=${encodeURIComponent(name)}`)).json();
  document.getElementById('editor').value = res.content;
  document.getElementById('editor').disabled = false;
  document.getElementById('editor-name').textContent = name;
  document.getElementById('save-btn').disabled = false;
  dirty = false;
  document.getElementById('editor').oninput = ()=>{ dirty=true; };
  loadFiles();
}

function newFile(){
  const name = prompt('New file name (e.g. D.md):');
  if(!name) return;
  currentFile = name;
  document.getElementById('editor').value = '';
  document.getElementById('editor').disabled = false;
  document.getElementById('editor-name').textContent = name;
  document.getElementById('save-btn').disabled = false;
  dirty = true;
}

// --- save & sync ---

async function saveAndSync(){
  if(!currentFile) return;
  const content = document.getElementById('editor').value;
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Syncing…';
  btn.disabled = true;
  const res = await fetch(API+`/api/file?name=${encodeURIComponent(currentFile)}`,{
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({content})
  });
  const data = await res.json();
  btn.textContent = 'Save & Sync';
  btn.disabled = false;
  dirty = false;
  showReport(data.report);
  document.getElementById('ws-stats').textContent =
    `${data.graph.nodes} nodes, ${data.graph.edges} edges`;
  loadFiles();
  await loadGraph();
}

function showReport(report){
  const el = document.getElementById('report');
  if(!report.events.length && !report.unresolved.length){
    el.innerHTML = '<div class="empty">No changes</div>';
    return;
  }
  let html = `<div style="margin-bottom:4px;color:var(--muted)">${report.files_scanned} file(s) scanned, ${report.files_changed} changed</div>`;
  report.events.forEach(ev=>{
    const cls = ev.kind.includes('added')?'added':ev.kind.includes('removed')?'removed':'file';
    const loc = ev.line ? `${ev.file}:${ev.line}` : ev.file;
    html += `<div class="ev"><span class="tag ${cls}">${ev.kind.toUpperCase()}</span>${loc} — ${ev.sentence||ev.triple||''}<br><span style="color:var(--muted)">${ev.reason}</span></div>`;
  });
  report.unresolved.forEach(u=>{
    html += `<div class="ev"><span class="tag unresolved">UNRESOLVED</span>${u}</div>`;
  });
  el.innerHTML = html;
}

// --- graph ---

async function loadGraph(){
  const data = await (await fetch(API+'/api/graph')).json();
  graphData = data;
  renderGraph(data);
}

function renderGraph(data){
  const container = document.getElementById('graph');
  container.innerHTML = '';
  const W = container.clientWidth, H = container.clientHeight;
  const svg = d3.select(container).append('svg').attr('width',W).attr('height',H);
  const g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.3,5]).on('zoom',e=>g.attr('transform',e.transform)));

  const colors = {concept:'var(--blue)',primitive:'var(--mauve)',evidence:'var(--teal)',action:'var(--green)'};

  const sim = d3.forceSimulation(data.nodes)
    .force('link', d3.forceLink(data.edges).id(d=>d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collision', d3.forceCollide(40));

  const link = g.append('g').selectAll('line').data(data.edges).join('g').attr('class','edge');
  link.append('line');
  link.append('text').text(d=>d.relation)
    .attr('text-anchor','middle').attr('dy',-6)
    .on('click',(e,d)=>inspectEdge(d));

  const node = g.append('g').selectAll('g').data(data.nodes).join('g').attr('class','node')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

  node.append('circle').attr('r',14).attr('fill',d=>colors[d.kind]||'var(--blue)').attr('stroke','var(--bg)')
    .on('click',(e,d)=>inspectNode(d));
  node.append('text').text(d=>d.label.length>18?d.label.slice(0,16)+'…':d.label)
    .attr('text-anchor','middle').attr('dy',28);

  sim.on('tick',()=>{
    link.select('line').attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    link.select('text').attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

// --- inspector ---

async function inspectNode(d){
  const res = await (await fetch(API+`/api/explain?label=${encodeURIComponent(d.label)}`)).json();
  const el = document.getElementById('inspector');
  let html = `<h4>Node: ${res.label} <span style="color:var(--muted)">(${res.kind})</span></h4>`;
  if(res.provenance && res.provenance.length){
    html += '<div class="row"><b>Provenance:</b></div>';
    res.provenance.forEach(p=>{
      const sec = p.section && p.section!=='top-level'?` section="${p.section}"`:'';
      html += `<div class="row prov">${p.file}:${p.line}${sec} v=${p.version.slice(0,8)}</div>`;
    });
  }
  if(res.edges && res.edges.length){
    html += '<div class="row"><b>Relationships:</b></div>';
    res.edges.forEach(e=>{
      html += `<div class="row edge">${e.relation} → ${e.other} (w=${e.weight}) — from ${e.provenance.map(p=>p.file).join(', ')}</div>`;
    });
  }
  el.innerHTML = html;
}

async function inspectEdge(d){
  const res = await (await fetch(API+`/api/source?subject=${encodeURIComponent(d.source_label)}&relation=${encodeURIComponent(d.relation)}&object=${encodeURIComponent(d.target_label)}`)).json();
  const el = document.getElementById('inspector');
  let html = `<h4>Edge: ${d.source_label} —[${d.relation}]→ ${d.target_label}</h4>`;
  if(Array.isArray(res)){
    res.forEach(r=>{
      html += `<div class="row"><b>Weight:</b> ${r.weight}</div>`;
      html += `<div class="row"><b>Claims:</b> ${r.claims.join(', ')}</div>`;
      html += '<div class="row"><b>Provenance:</b></div>';
      r.provenance.forEach(p=>{
        html += `<div class="row prov">${p.file}:${p.line} section="${p.section}" v=${p.version.slice(0,8)}</div>`;
      });
    });
  }
  el.innerHTML = html;
}

// --- init ---

async function init(){
  const ws = await (await fetch(API+'/api/workspace')).json();
  document.getElementById('ws-path').textContent = ws.dir;
  document.getElementById('ws-stats').textContent =
    `${ws.graph_stats.nodes} nodes, ${ws.graph_stats.edges} edges`;
  loadFiles();
  loadGraph();
}
init();
</script>
</body>
</html>
